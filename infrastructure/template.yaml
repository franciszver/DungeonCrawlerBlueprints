AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DungeonCrawlerBlueprints - AI-powered room detection service

Globals:
  Function:
    Timeout: 120
    Runtime: python3.13
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref JobsTable
        S3_BUCKET_NAME: !Ref BlueprintsBucket
        REFINEMENT_CACHE_TABLE: !Ref RefinementCacheTable
        SECRETS_MANAGER_SECRET_NAME: dungeoncrawler/openrouter-api-key
        OPENROUTER_MODEL: google/gemini-flash-1.5
        # Multi-Model Detection
        CONFIDENCE_THRESHOLD: '0.75'
        MAX_RETRY_ATTEMPTS: '0'
        # Detection Features
        ENABLE_ROOM_DETECTION: 'true'
        ENABLE_POLYGON_DETECTION: 'true'
        ENABLE_DOOR_DETECTION: 'true'
        FEW_SHOT_EXAMPLE_COUNT: '0'
        # Processing Features (for speed optimization)
        ENABLE_TEXT_EXTRACTION: 'false'
        ENABLE_AUTO_EDGE_REFINEMENT: 'false'
        # Canvas Limits
        MAX_CANVAS_WIDTH: '2000'
        MAX_CANVAS_HEIGHT: '2000'

Resources:
  # ECR Repository for RefineFunction Container Image (Optional Upgrade)
  RefineFunctionECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dungeoncrawler-blueprints-refine
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # Lambda Layer for Dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: DungeonCrawlerBlueprints-Dependencies
      Description: Common dependencies for all Lambda functions
      ContentUri: ../layers/dependencies
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13

  # API Gateway
  BlueprintsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: DungeonCrawlerBlueprints-API
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        AllowOrigin: "'*'"
        AllowCredentials: false
        MaxAge: "'600'"
      Auth:
        ApiKeyRequired: true
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # API Key
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: DungeonCrawlerBlueprints-APIKey
      Description: API Key for DungeonCrawlerBlueprints
      Enabled: true

  # Usage Plan - Commented out for initial deployment
  # Can be added manually after stack creation if needed
  # UsagePlan:
  #   Type: AWS::ApiGateway::UsagePlan
  #   DependsOn: BlueprintsApi
  #   Properties:
  #     UsagePlanName: DungeonCrawlerBlueprints-UsagePlan
  #     Description: Usage plan for DungeonCrawlerBlueprints API
  #     ApiStages:
  #       - ApiId: !Ref BlueprintsApi
  #         Stage: dev
  #     Throttle:
  #       BurstLimit: 10
  #       RateLimit: 5
  #     Quota:
  #       Limit: 10000
  #       Period: MONTH
  #
  # UsagePlanKey:
  #   Type: AWS::ApiGateway::UsagePlanKey
  #   Properties:
  #     KeyId: !Ref ApiKey
  #     KeyType: API_KEY
  #     UsagePlanId: !Ref UsagePlan

  # S3 Bucket for Blueprints
  BlueprintsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-blueprints-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBlueprints
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # DynamoDB Table
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DungeonCrawlerBlueprints-Jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: blueprint_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BlueprintIdIndex
          KeySchema:
            - AttributeName: blueprint_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # DynamoDB Table for Refinement Cache
  RefinementCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DungeonCrawlerBlueprints-RefinementCache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Secrets Manager Secret for OpenRouter API Key
  # Note: Secret is created manually via scripts/setup-secret.ps1
  # Reference: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dungeoncrawler/openrouter-api-key-*

  # Lambda Functions
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Upload
      CodeUri: ../backend/functions/upload
      Handler: handler.lambda_handler
      Layers:
        - !Ref DependenciesLayer
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /upload
            Method: post
            Auth:
              ApiKeyRequired: true
      Policies:
        - S3WritePolicy:
            BucketName: !Ref BlueprintsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref BlueprintsBucket
          DYNAMODB_TABLE_NAME: !Ref JobsTable

  DetectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Detect
      CodeUri: ../backend
      Handler: functions.detect.handler.lambda_handler
      Timeout: 120
      MemorySize: 3008
      Layers:
        - !Ref DependenciesLayer
      Events:
        DetectApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /detect
            Method: post
            Auth:
              ApiKeyRequired: true
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref BlueprintsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dungeoncrawler/openrouter-api-key-*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:DungeonCrawlerBlueprints-Detect'

  ResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Results
      CodeUri: ../backend
      Handler: functions.results.handler.lambda_handler
      Layers:
        - !Ref DependenciesLayer
      Events:
        ResultsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /results/{id}
            Method: get
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable

  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Export
      CodeUri: ../backend
      Handler: functions.export.handler.lambda_handler
      Layers:
        - !Ref DependenciesLayer
      Events:
        ExportApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /export/{id}
            Method: get
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Health
      CodeUri: ../backend
      Handler: functions.health.handler.lambda_handler
      Layers:
        - !Ref DependenciesLayer
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /health
            Method: get
            Auth:
              ApiKeyRequired: true

  ExtendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Extend
      CodeUri: ../backend
      Handler: functions.extend.handler.lambda_handler
      Timeout: 30
      MemorySize: 3008
      Layers:
        - !Ref DependenciesLayer
      Events:
        ExtendApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /extend/{id}
            Method: post
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dungeoncrawler/openrouter-api-key-*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::${BlueprintsBucket}/*'
                - !Sub 'arn:aws:s3:::${BlueprintsBucket}'

  RefineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DungeonCrawlerBlueprints-Refine
      CodeUri: ../backend
      Handler: functions.refine.handler.lambda_handler
      Timeout: 60
      MemorySize: 2048
      Layers:
        - !Ref DependenciesLayer
      Events:
        RefineApi:
          Type: Api
          Properties:
            RestApiId: !Ref BlueprintsApi
            Path: /refine/{job_id}
            Method: post
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RefinementCacheTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub '${BlueprintsBucket.Arn}'
                - !Sub '${BlueprintsBucket.Arn}/*'

  # Optional: RefineFunction with OpenCV Container Image (for maximum accuracy)
  # Uncomment and set ImageUri parameter to use container image instead of zip deployment
  # Requires building and pushing Docker image to ECR first (see scripts/build-refine-container.sh)
  # RefineFunctionContainer:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     FunctionName: DungeonCrawlerBlueprints-Refine-Container
  #     PackageType: Image
  #     ImageUri: !Sub '${RefineFunctionECR.RepositoryUri}:latest'
  #     Timeout: 60
  #     MemorySize: 2048
  #     Events:
  #       RefineApiContainer:
  #         Type: Api
  #         Properties:
  #           RestApiId: !Ref BlueprintsApi
  #           Path: /refine/{job_id}
  #           Method: post
  #           Auth:
  #             ApiKeyRequired: true
  #     Policies:
  #       - DynamoDBCrudPolicy:
  #           TableName: !Ref JobsTable
  #       - Version: '2012-10-17'
  #         Statement:
  #           - Effect: Allow
  #             Action:
  #               - s3:GetObject
  #               - s3:ListBucket
  #             Resource:
  #               - !Sub '${BlueprintsBucket.Arn}'
  #               - !Sub '${BlueprintsBucket.Arn}/*'

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${BlueprintsApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ApiKeyId:
    Description: API Key ID
    Value: !Ref ApiKey
    Export:
      Name: !Sub '${AWS::StackName}-ApiKeyId'

  S3BucketName:
    Description: S3 Bucket for blueprints
    Value: !Ref BlueprintsBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3Bucket'

  DynamoDBTableName:
    Description: DynamoDB Table name
    Value: !Ref JobsTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTable'

  SecretArn:
    Description: Secrets Manager Secret ARN
    Value: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dungeoncrawler/openrouter-api-key-*'
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  RefineFunctionECRRepositoryUri:
    Description: ECR Repository URI for RefineFunction container image (optional upgrade)
    Value: !Sub '${RefineFunctionECR.RepositoryUri}'
    Export:
      Name: !Sub '${AWS::StackName}-RefineFunctionECR'

